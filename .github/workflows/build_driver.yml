name: Build Astral V2

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Compile Driver
      shell: cmd
      run: |
        cl /nologo /O2 /W3 /Gy /Gw /kernel /std:c++17 /c main.cpp registry.cpp spoofer.cpp utils.cpp
        link /nologo /driver /entry:DriverEntry /subsystem:native /nodefaultlib /out:astral_drv.sys main.obj registry.obj spoofer.obj utils.obj ntoskrnl.lib hal.lib libcntpr.lib

    - name: Upload Driver Artifact
      uses: actions/upload-artifact@v4
      with:
        name: astral_drv
        path: astral_drv.sys
